
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خدمات الكوتش</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6f5;color:#18352b}
header{background:linear-gradient(135deg,#103e30,#21845b);color:white;text-align:center;padding:35px 15px 40px;border-radius:0 0 28px 28px}
header h1{font-size:32px;margin:5px}
header p{margin:10px 0;color:#e0f3e9}
main{max-width:650px;margin:25px auto;padding:15px}
.welcome{text-align:center;margin-bottom:24px}
.welcome h2{font-size:24px}
.services{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.card{background:white;border-radius:18px;padding:22px 12px;text-align:center;box-shadow:0 5px 18px #12372a12}
.emoji{font-size:40px}
.card h3{margin:12px 0 16px}
button{border:0;border-radius:10px;background:#16734d;color:white;font-size:16px;padding:13px;width:100%;cursor:pointer}
form{background:white;margin-top:22px;padding:20px;border-radius:18px;box-shadow:0 5px 18px #12372a10}
label{display:block;margin:14px 0 7px}
input,select,textarea{width:100%;padding:13px;border:1px solid #d5dfd9;border-radius:10px;font-size:16px;background:#fff}
.note{font-size:13px;color:#68786f;line-height:1.8}
footer{text-align:center;padding:25px;color:#63746a}
.whatsapp{position:fixed;bottom:20px;right:20px;background:#25D366;color:white;padding:14px 20px;border-radius:50px;text-decoration:none;font-size:16px;font-weight:bold;box-shadow:0 4px 10px #0003;z-index:9999}
</style>
</head>
<body>
<header>
<div style="font-size:42px">💚</div>
<h1>خدمات الكوتش</h1>
<p>خدماتك اليومية في مكان واحد</p>
</header>

<main>
<section class="welcome">
<h2>أهلاً بيك 👋</h2>
<p>اختار الخدمة اللي محتاجها واملأ طلبك بسهولة.</p>
</section>

<section class="services">
<div class="card"><div class="emoji">💵</div><h3>سحب كاش</h3><button type="button" onclick="pick('سحب كاش')">اطلب الخدمة</button></div>
<div class="card"><div class="emoji">💰</div><h3>إيداع كاش</h3><button type="button" onclick="pick('إيداع كاش')">اطلب الخدمة</button></div>
<div class="card"><div class="emoji">📱</div><h3>شحن رصيد</h3><button type="button" onclick="pick('شحن رصيد')">اطلب الخدمة</button></div>
<div class="card"><div class="emoji">🧾</div><h3>دفع فواتير</h3><button type="button" onclick="pick('دفع فواتير')">اطلب الخدمة</button></div>
</section>

<form id="orderForm" onsubmit="sendOrder(event)">
<h2>اطلب خدمتك الآن</h2>
<label for="service">نوع الخدمة</label>
<select id="service" required>
<option>سحب كاش</option>
<option>إيداع كاش</option>
<option>شحن رصيد</option>
<option>دفع فواتير</option>
</select>

<label for="amount">المبلغ بالجنيه (اختياري)</label>
<input id="amount" type="number" min="1" placeholder="مثال: 200">

<label for="details">رقم الهاتف أو تفاصيل الطلب</label>
<input id="details" type="text" placeholder="اكتب تفاصيل الطلب" required>

<button type="submit" style="margin-top:18px">إرسال الطلب عبر واتساب</button>
<p class="note">سيتم فتح واتساب برسالة تحتوي على تفاصيل طلبك لمراجعتها وإرسالها.</p>
</form>
</main>

<footer>خدمات الكوتش © 2026</footer>

<a class="whatsapp"
href="https://wa.me/201028778017"
target="_blank" rel="noopener noreferrer">
تواصل معنا عبر واتساب
</a>

<script>
function pick(s){
document.getElementById('service').value=s;
document.getElementById('orderForm').scrollIntoView({behavior:'smooth'});
}

function sendOrder(e){
e.preventDefault();

const service = document.getElementById('service').value;
const amount = document.getElementById('amount').value.trim();
const details = document.getElementById('details').value.trim();

const message =
'طلب جديد - خدمات الكوتش\n' +
'نوع الخدمة: ' + service + '\n' +
'المبلغ: ' + (amount ? amount + ' جنيه' : 'لم يحدد') + '\n' +
'رقم الهاتف أو تفاصيل الطلب: ' + details;

const url = 'https://wa.me/201028778017?text=' +
encodeURIComponent(message);

window.open(url, '_blank');
}
</script>
</body>
</html>
